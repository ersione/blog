<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reveal.js 세 테마 미리보기</title>
<style>body{margin:0;background:#f6f8fc;color:#182235;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}select{padding:8px;border:1px solid #94a3b8;border-radius:8px;background:white;font:inherit}iframe{display:block;width:100%;height:calc(100vh - 95px);min-height:280px;border:0}p{font-size:12px;margin:0;color:#526178}</style>
<header><label>테마 <select id="theme"><option value="ersione-light">Ersione Light</option><option value="ersione-dark">Ersione Dark</option><option value="ersione-mint">Ersione Mint</option></select></label><p>슬라이드를 누른 뒤 방향키로 이동합니다. 글꼴은 로컬 대체 글꼴을 사용합니다.</p></header>
<iframe title="선택한 테마의 실제 발표 예제" src="./examples/ersione-light-template.html"></iframe>
<script>document.getElementById('theme').addEventListener('change',event=>{document.querySelector('iframe').src='./examples/'+event.target.value+'-template.html'})</script></html>
