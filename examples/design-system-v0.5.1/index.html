<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 토큰과 React 컴포넌트 미리보기</title><link rel="stylesheet" href="./styles.css">
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.65 system-ui,"Malgun Gothic",sans-serif}.demo{padding:24px;color:var(--text);background:var(--bg);min-height:100vh}h1{font-size:22px;margin:0}h2{font-size:18px;margin:26px 0 12px}p{margin:8px 0 16px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0}.controls label{display:flex;gap:8px;align-items:center}.palette{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:16px}.palette-row{display:grid;grid-template-columns:65px repeat(3,minmax(0,1fr));gap:10px;align-items:center;margin:10px 0}.palette-row>div{min-width:0}.swatch{display:block;height:34px;border-radius:7px;border:1px solid var(--line)}code{font:12px ui-monospace,monospace}.labels,.note{font-size:12px;color:var(--muted)}.eds-data-panel{margin-top:16px}@media(max-width:440px){.demo{padding:12px}.palette{padding:10px}.palette-row{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:6px}code{font-size:10px}.labels{font-size:10px}}
</style><div id="root"></div><script src="./demo.js"></script></html>
